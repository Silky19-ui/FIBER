name: Compilar APK de Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Clonar repositorio
      uses: actions/checkout@v4

    - name: 🔍 Ver qué carpetas existen (Depuración)
      run: ls -la

    - name: ☕ Configurar Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: ⚙️ Configurar Android SDK
      uses: android-actions/setup-android@v4

    - name: 🔑 Dar permisos de ejecución y compilar
      working-directory: ./fiber  # Si tu carpeta tiene mayúsculas, cámbiala aquí (ej. ./Fiber o ./FIBER)
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: 📦 Subir el APK generado
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: fiber/app/build/outputs/apk/debug/app-debug.apk
