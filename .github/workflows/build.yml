name: Compilar APK de Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Clonar repositorio
      uses: actions/checkout@v4

    - name: ☕ Configurar Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: ⚙️ Configurar Android SDK
      uses: android-actions/setup-android@v3

    - name: 🔑 Dar permisos de ejecución a Gradle
      run: chmod +x gradlew

    - name: 🛠️ Compilar APK de depuración (Debug)
      run: ./gradlew assembleDebug

    - name: 📦 Subir el APK generado (Actualizado a v4)
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
