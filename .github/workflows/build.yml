name: Compilar APK de Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Clonar repositorio
      uses: actions/checkout@v4

    - name: ☕ Configurar Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: ⚙️ Configurar Android SDK
      uses: android-actions/setup-android@v4

    - name: 🔍 Encontrar Gradle y Compilar APK
      run: |
        # Busca automáticamente el archivo gradlew en cualquier subcarpeta del repositorio
        GRADLEW_PATH=$(find . -name "gradlew" -type f -print -quit)
        
        if [ -z "$GRADLEW_PATH" ]; then
          echo "❌ Error: No se encontró el archivo 'gradlew' en el repositorio."
          exit 1
        fi
        
        # Obtiene la carpeta donde está el proyecto
        DIR_PROYECTO=$(dirname "$GRADLEW_PATH")
        echo "✅ Proyecto encontrado en la ruta: $DIR_PROYECTO"
        
        # Entra a la carpeta, da permisos y compila
        cd "$DIR_PROYECTO"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: 📦 Subir el APK generado
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        # Busca el APK de forma recursiva sin importar la carpeta contenedora
        path: '**/app/build/outputs/apk/debug/app-debug.apk'
